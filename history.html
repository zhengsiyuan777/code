const totalQuestion = 10;
function updateProgress(){
  let checkedCount = 0;
  for(let i = 1; i <= totalQuestion; i++){
    if(document.querySelector(`input[name="q${i}"]:checked`)) checkedCount++;
  }
  const percent = (checkedCount / totalQuestion) * 100;
  document.getElementById("progressText").innerText = `${checkedCount} / ${totalQuestion}`;
  document.getElementById("progressBar").style.width = `${percent}%`;
  document.getElementById("submitBtn").disabled = checkedCount < totalQuestion;
}
function showResult(){
  const inputs = document.querySelectorAll('input[type="radio"]:checked');
  if(inputs.length < totalQuestion){
    alert("请完成全部10道题目！");
    return;
  }
  let ansCode = "";
  inputs.forEach(i => ansCode += i.value);
  let bestMatch = characterList[0];
  let minDiff = 999;
  characterList.forEach(person => {
    let diff = 0;
    for(let i = 0; i < 10; i++){
      if(person.code[i] !== ansCode[i]) diff++;
    }
    if(diff < minDiff){
      minDiff = diff;
      bestMatch = person;
    }
  });
  const similarity = ((10 - minDiff) / 10 * 100).toFixed(0);
  document.getElementById("resultImg").src = bestMatch.img;
  document.getElementById("resultImg").alt = bestMatch.name;
  document.getElementById("resultName").innerText = bestMatch.name;
  document.getElementById("resultTitle").innerText = bestMatch.title;
  document.getElementById("resultMbtTag").innerText = "MBTI：" + bestMatch.mbti;
  document.getElementById("resultKeyTag").innerText = bestMatch.title;
  document.getElementById("resultPercent").innerText = similarity + "%";
  document.getElementById("resultBar").style.width = similarity + "%";
  document.getElementById("resultImageDesc").innerText = bestMatch.imageDesc;
  document.getElementById("resultDetail").innerText = bestMatch.detail;
  document.getElementById("resultFunText").innerText = bestMatch.funText;
  document.getElementById("resultModern").innerText = bestMatch.modern;
  document.getElementById("resultMatchText").innerText = bestMatch.matchText;
  const funTagsWrap = document.getElementById("resultFunTags");
  funTagsWrap.innerHTML = "";
  bestMatch.funTags.forEach(tag => {
    const span = document.createElement("span");
    span.className = "tag-fun px-3 py-1 rounded-full text-sm font-semibold";
    span.innerText = tag;
    funTagsWrap.appendChild(span);
  });
  let matchTip = "";
  if(similarity >= 90) matchTip = "几乎是灵魂复刻，你们的底层偏好非常接近。";
  else if(similarity >= 75) matchTip = "相似度很高，你们在很多重要选择上会很像。";
  else if(similarity >= 60) matchTip = "有不少相似之处，也有各自不同的侧面。";
  else matchTip = "相似度中等，你们更像同气质但不同活法的人。";
  document.getElementById("resultSimilarityText").innerText = matchTip;
  document.getElementById("page-question").classList.remove("active");
  document.getElementById("page-result").classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function restartTest(){
  document.querySelectorAll('input[type="radio"]').forEach(el => el.checked = false);
  updateProgress();
  document.getElementById("page-result").classList.remove("active");
  document.getElementById("page-question").classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
